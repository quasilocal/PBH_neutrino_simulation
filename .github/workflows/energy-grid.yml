# Energy grid of the multigroup calculation (App. C): the 66 runs of simulation/energy_grid/scan.py on 17 runners,
# about 25 minutes. Start it from the Actions tab ("Run workflow"); the results (points/, res_*.json, summary.txt) are
# offered as the artifact energy-grid-results. A push to a branch named energy-grid-run also starts it, and then the
# results are committed to that branch.
name: energy grid
on:
  workflow_dispatch:
  push:
    branches: [energy-grid-run]
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "chunks=$(python3 simulation/energy_grid/scan.py list)" >> "$GITHUB_OUTPUT"
  runs:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python simulation/energy_grid/scan.py run ${{ matrix.chunk }}
        timeout-minutes: 340
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: points-${{ matrix.chunk }}
          path: simulation/energy_grid/points/
          if-no-files-found: warn
  collect:
    needs: runs
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: points-*
          path: simulation/energy_grid/points/
          merge-multiple: true
      - run: cd simulation/energy_grid && python3 merge.py
      - uses: actions/upload-artifact@v4
        with:
          name: energy-grid-results
          path: |
            simulation/energy_grid/points/
            simulation/energy_grid/res_*.json
            simulation/energy_grid/summary.txt
      - if: github.ref_name == 'energy-grid-run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation/energy_grid
          git commit -m "Energy-grid results (energy grid workflow)" || echo "nothing to commit"
          git push
