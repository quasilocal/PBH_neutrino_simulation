# One-off: moves the 80 files that were uploaded to the top folder into simulation/ and paper/figs/.
# It runs once, when this file is committed. Afterwards you can delete this file.
name: move uploaded files
on:
  push:
    paths: ['.github/workflows/move-uploaded-files.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the files and push
        run: |
          set -e
          if [ ! -f run_nuc.py ]; then echo "Nothing to move: the files are not in the top folder."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p paper/figs
          for f in dyn_data.npz dyn_nu0535.npy fig_dynamics.py fig_linear.py fig_mass.py fig_massfn.py \
            fig_scaling.py lin_offcentre.npz linproxy_R.json numbers_mass.py numbers_stats.py style.py; do
            git mv "$f" paper/figs/
          done
          for f in conv_fluid.py dyn_runs_diag.py logB.txt logE2.txt logF.txt logR.txt \
            log_K64b.txt log_gray075.txt log_gray1a.txt log_mg1.txt log_mg7b.txt log_nuc100.txt \
            log_r15b.txt ms_eosc2.py proxies.py qG.sh qS.sh q_flag.sh \
            q_mg4.sh q_shape1.sh q_two3.sh q_two4.sh res_accrete_fnu0.0_d0.50773.json res_bhmass_fnu0.409_N400_K32.json \
            res_eos_fs_2.0.json res_eos_pf_1.5.json res_eos_pf_10.0.json res_eos_pf_3.0.json res_eos_pf_40.0.json res_eosc2_1.5_2.5_10.0.json \
            res_eosc2_1.5_2.5_20.0.json res_eosc2_2.0_2.0_20.0.json res_eosc_0.75_1.5.json res_eosc_0.75_40.0.json res_eosc_0.75_5.0.json res_eosc_0.75_80.0.json \
            res_eosc_1.0_1.0.json res_eosc_1.0_1.5.json res_eosc_1.5_1.5.json res_eosc_1.5_160.0.json res_eosc_1.5_20.0.json res_eosc_1.5_40.0.json \
            res_eosc_2.0_0.5.json res_eosc_2.0_3.0.json res_eosc_2.0_40.0.json res_eosc_2.0_80.0.json res_eosc_3.0_0.5.json res_eosc_3.0_10.0.json \
            res_fl_e02.json res_mg_phys6_10.0.json res_mg_phys6_3.0.json res_mg_phys6_5.0.json res_nu20_K32.json res_nu30_K32.json \
            res_nu409_K64b.json res_nu409_flag.json res_nu409_q03.json res_nu409_r15.json res_phys_0.5.json res_phys_1.0.json \
            res_phys_10.0.json res_phys_2.0.json res_phys_20.0.json res_phys_3.0.json run_eos.py run_fluid.py \
            run_nuc.py test_switch.py; do
            git mv "$f" simulation/
          done
          git commit -m "Move uploaded files into simulation/ and paper/figs/"
          git push origin HEAD:${{ github.ref_name }}
